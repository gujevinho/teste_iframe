<!DOCTYPE html>
<head>

  <style>
    body {
      margin: 0;
      background-color: gray;

    h4 {
      color: white;
    }

    div {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      height: 95vh;
      width: 95vw;
      border-radius: none;
    }
  </style>

<body>
  <div>
    <h4>Iframe App Facesign</h4>

    <!-- For proper behavior, in order to block warnings on non Safari browsers, allowfullscreen needs to be after allow   -->
    <iframe id="facetec-iframe" allow="fullscreen;camera;geolocation" allowfullscreen src="https://app-dev.facesign.in/liveness/778eff37-e3c4-4a6c-9194-02378114f2ec/userid"></iframe>
